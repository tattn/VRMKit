name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-mtoon-metallibs:
    name: Check MToon metallibs are up to date
    # Compares the recorded build inputs rather than the metallibs, whose bytes vary
    # across Metal toolchain versions, so the cheap Linux runner is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify recorded metallib build inputs match sources
        run: ./scripts/build-mtoon-metallibs.sh --check

  test-package:
    name: Test package (${{ matrix.platform }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sim_platform: iOS Simulator
            device_name: iPhone
          - platform: macOS
            sim_platform: macOS
            device_name: My Mac
          - platform: watchOS
            sim_platform: watchOS Simulator
            device_name: Watch
          - platform: xrOS
            sim_platform: visionOS Simulator
            device_name: Apple Vision Pro
    steps:
      - uses: actions/checkout@v7
      - name: Test VRMKit
        run: |
          set -o pipefail
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            swift test | xcbeautify
          else
            make test-package-platform \
              SIM_PLATFORM="${{ matrix.sim_platform }}" \
              RUNTIME_PLATFORM="${{ matrix.platform }}" \
              DEVICE_NAME="${{ matrix.device_name }}" \
              RESULT_BUNDLE="TestResults/${{ matrix.platform }}.xcresult" | xcbeautify
          fi
      # xcbeautify drops the values an expectation failed with; the result bundle keeps them.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ matrix.platform }}
          path: TestResults
          if-no-files-found: ignore

  test-android:
    name: Test package (Android)
    # VRMRealityKit compiles to nothing off Apple platforms, so this checks that VRMKit and
    # VRMKitRuntime build and pass their tests where Apple's simd and CoreGraphics are absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test on the Android emulator
        uses: skiptools/swift-android-action@v2
        with:
          free-disk-space: true
          # The action copies only `.resources` bundles, and Swift Build names them `.bundle`.
          copy-files: .build/out/Products/*/VRMKit_VRMTestSupport.bundle

  build-examples:
    name: Build examples (iOS/visionOS/macOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Build All Examples
        run: |
          set -o pipefail
          make build-examples | xcbeautify
