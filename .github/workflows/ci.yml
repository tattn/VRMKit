name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-mtoon-metallibs:
    name: Check MToon metallibs are up to date
    # Only compares the recorded build inputs, so the cheap Linux runner is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The bundled metallibs are stale when the shader sources or the compile
      # settings change without re-running the build script. --check compares
      # the recorded build inputs (metallib bytes vary across Metal toolchain
      # versions) and needs no Metal toolchain, so it runs on the cheap runner
      # ahead of the macOS jobs.
      - name: Verify recorded metallib build inputs match sources
        run: ./scripts/build-mtoon-metallibs.sh --check

  test-package:
    name: Test package (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sim_platform: iOS Simulator
            device_name: iPhone
          - platform: macOS
            sim_platform: macOS
            device_name: My Mac
          - platform: watchOS
            sim_platform: watchOS Simulator
            device_name: Watch
          - platform: xrOS
            sim_platform: visionOS Simulator
            device_name: Apple Vision Pro
    steps:
      - uses: actions/checkout@v4
      - name: Test VRMKit
        run: |
          set -o pipefail
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            swift test | xcbeautify
          else
            make test-package-platform \
              SIM_PLATFORM="${{ matrix.sim_platform }}" \
              RUNTIME_PLATFORM="${{ matrix.platform }}" \
              DEVICE_NAME="${{ matrix.device_name }}" | xcbeautify
          fi

  build-examples:
    name: Build examples (iOS/visionOS/macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build All Examples
        run: |
          set -o pipefail
          make build-examples | xcbeautify
